# Local development infrastructure for ClaimFlow.
# Start:  docker compose up -d
# Stop:   docker compose down        (keeps database data)
# Reset:  docker compose down -v     (also deletes database data)
#
# NOTE: credentials below are throwaway LOCAL-DEV values, not real secrets.

name: claimflow

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: claimflow
      POSTGRES_PASSWORD: claimflow_dev
      POSTGRES_DB: claimflow
    ports:
      # Host port 5433 (not 5432) because a local PostgreSQL install already uses 5432
      # on the dev machine. Our API connects to localhost:5433.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimflow -d claimflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Official Apache Kafka image, running in KRaft mode (no ZooKeeper needed).
    # Single node = acts as both broker (stores messages) and controller (manages the cluster).
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Where Kafka listens inside the container: 9092 for clients, 9093 for internal controller traffic.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The address Kafka tells clients to connect back to. Our API runs on the host (not in Docker),
      # so this must be localhost:9092. Getting this wrong is the #1 cause of "can't connect".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single node, so internal topics can only have 1 copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # New topics get 3 partitions by default (lets us demonstrate keying by claim id).
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
